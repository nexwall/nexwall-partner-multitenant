apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379; do echo waiting for postgres/redis; sleep 2; done"]
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0:8080"
            - name: GIN_MODE
              value: "debug"
            - name: LOG_LEVEL
              value: "trace"
            - name: LOG_FORMAT
              value: "console"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: REDIS_DB
              value: "0"
            - name: APP_URL
              value: "https://partner.nexwall.com.br"
            - name: API_BASE_URL
              value: "/api"
          envFrom:
            - secretRef:
                name: partner-plane-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 10000
      targetPort: 8080
