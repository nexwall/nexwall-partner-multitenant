apiVersion: apps/v1
kind: Deployment
metadata:
  name: collect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collect
  template:
    metadata:
      labels:
        app: collect
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379; do echo waiting for postgres/redis; sleep 2; done"]
      containers:
        - name: collect
          image: {{ .Values.images.collect }}
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0:8080"
            - name: GIN_MODE
              value: "debug"
            - name: LOG_LEVEL
              value: "debug"
            - name: LOG_FORMAT
              value: "console"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: REDIS_DB
              value: "1"
          envFrom:
            - secretRef:
                name: partner-plane-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: collect
spec:
  selector:
    app: collect
  ports:
    - port: 10000
      targetPort: 8080
