apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: {{ .Values.images.proxy }}
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BACKEND_SERVICE_NAME
              value: "backend"
            - name: COLLECT_SERVICE_NAME
              value: "collect"
            - name: FRONTEND_SERVICE_NAME
              value: "frontend"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    app: proxy
  ports:
    - port: 8080
      targetPort: 8080
{{- if eq .Values.proxy.service.type "NodePort" }}
      nodePort: {{ .Values.proxy.service.nodePort }}
{{- end }}
