apiVersion: v1
kind: Secret
metadata:
  name: partner-plane-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.secrets.postgresPassword }}@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LOGTO_TENANT_ID: {{ .Values.secrets.logtoTenantId | quote }}
  LOGTO_TENANT_DOMAIN: {{ .Values.secrets.logtoTenantDomain | quote }}
  LOGTO_API_RESOURCE: {{ .Values.secrets.logtoApiResource | quote }}
  LOGTO_FRONTEND_APP_ID: {{ .Values.secrets.logtoFrontendAppId | quote }}
  LOGTO_BACKEND_APP_ID: {{ .Values.secrets.logtoBackendAppId | quote }}
  LOGTO_BACKEND_APP_SECRET: {{ .Values.secrets.logtoBackendAppSecret | quote }}
